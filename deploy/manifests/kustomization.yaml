apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: crm
resources:
  - namespace.yaml
  - redis.yaml
  - python-svc.yaml
  - backend.yaml
  - cron.yaml
  - email-scheduler.yaml
  - frontend.yaml
# migrate.yaml is intentionally NOT listed - deploy.sh runs it as a one-shot
# Job (fixed-name Jobs can't be re-applied without deleting first).
