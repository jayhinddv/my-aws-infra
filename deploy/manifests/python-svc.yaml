apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-svc
  namespace: crm
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels: { app: python-svc }
  template:
    metadata:
      labels: { app: python-svc }
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      terminationGracePeriodSeconds: 30
      containers:
        - name: python-svc
          image: ghcr.io/paidalabs-iref/crm-python-svc:prod
          imagePullPolicy: Always
          envFrom:
            - secretRef: { name: backend-env }
          env:
            - { name: HOST, value: "0.0.0.0" }
            - { name: PORT, value: "9100" }
          ports:
            - containerPort: 9100
          resources:
            limits:
              cpu: "1"
              memory: "1Gi"
          readinessProbe:
            httpGet: { path: /health, port: 9100 }
            initialDelaySeconds: 10
            periodSeconds: 15
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
---
apiVersion: v1
kind: Service
metadata:
  name: python-svc
  namespace: crm
spec:
  selector: { app: python-svc }
  ports:
    - port: 9100
      targetPort: 9100
