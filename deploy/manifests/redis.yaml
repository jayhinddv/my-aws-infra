apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: crm
spec:
  accessModes: [ReadWriteOnce]
  # ON THE VPS this was "local-path". On AWS the in-tree provisioner is
  # "gp2" (or "gp3" if you created that StorageClass). Leaving it unset uses
  # the cluster's default StorageClass, which kubeadm + the AWS EBS CSI driver
  # set up. If your cluster has no default SC, set storageClassName: gp2.
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: crm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args:
            - redis-server
            - --requirepass
            - Jayhind@redis
            - --maxmemory
            - 512mb
            - --maxmemory-policy
            - allkeys-lru
            - --appendonly
            - "yes"
            - --save
            - "900"
            - "1"
          ports:
            - containerPort: 6379
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: redis-data
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: crm
spec:
  selector: { app: redis }
  ports:
    - port: 6379
      targetPort: 6379
