apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: crm
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1           # spawn new pod BEFORE killing old -> zero downtime
      maxUnavailable: 0
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      terminationGracePeriodSeconds: 30
      containers:
        - name: frontend
          image: ghcr.io/paidalabs-iref/crm-frontend:prod
          imagePullPolicy: Always
          env:
            - { name: HOSTNAME, value: "0.0.0.0" }
          ports:
            - containerPort: 8000
          readinessProbe:
            tcpSocket: { port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: crm
spec:
  type: NodePort
  selector: { app: frontend }
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30901
